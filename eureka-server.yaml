management:
  endpoints:
    web:
      exposure:
        include: "*"

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  instance:
    hostname: eureka-server
  client:
    fetchRegistry: false
    registerWithEureka: false
    serviceUrl:
      defaultZone: http://eureka-server:8080/eureka
