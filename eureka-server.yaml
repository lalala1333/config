management:
  endpoints:
    web:
      exposure:
        include: "*"

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  instance:
    hostname: eureka-server
  client:
    fetchRegistry: false
    registerWithEureka: false
    service-url:
      default-zone: http://eureka-server:8080/eureka
