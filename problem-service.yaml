spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true
  
endpoints:
  shutdown:
    enabled: unrestricted

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      default-zone: http://${EUREKA_HOST:localhost}:8080/eureka

info:
  app:
    name: "problem-service"
    description: "problem-service microservice"
    version: "1.0.0"
