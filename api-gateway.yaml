management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: http://eureka-server:8080/eureka

info:
  app:
    name: "api-gateway"
    description: "api-gateway microservice"
    version: "1.0.0"

logging:
  level:
    com:
      example:
        apigateway: DEBUG
